plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.e.jizhnag'
    compileSdk 36

    defaultConfig {
        applicationId 'com.e.jizhnag'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

   // implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

implementation (files("libs/MPAndroidChart-v3.0.1.jar"))

    implementation "org.jsoup:jsoup:1.15.4"
    implementation "com.squareup.okhttp3:okhttp:3.4.0"
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
}
